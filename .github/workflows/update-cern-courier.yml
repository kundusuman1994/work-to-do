name: update-cern-courier

# CERN Courier is bimonthly, so once a week is ample. The job reads one HTML page
# and writes a small JSON file. No PDFs and no images are stored in the repo - the
# covers and the editions themselves stay hotlinked to cerncourier.com, so this
# listing is only a set of pointers plus the labels to show next to them.
on:
  schedule:
    - cron: '20 5 * * 1'        # Mondays, 05:20 UTC
  workflow_dispatch:            # and a manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape the magazine archive
        run: |
          python3 - <<'PYEOF'
          import json, re, datetime, urllib.request

          SRC = 'https://cerncourier.com/p/magazine/'
          KEEP = 5

          MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Sept','Oct','Nov','Dec','June','July']

          def absolute(u):
              u = u.strip()
              if u.startswith('//'):
                  u = 'https:' + u
              elif u.startswith('/'):
                  u = 'https://cerncourier.com' + u
              return re.sub(r'(?<!:)//wp-content', '/wp-content', u)

          def label_from(pdf):
              """CERNCourier2026JulAug-digitaledition.pdf -> 'Jul/Aug 2026'.
              Read off the filename rather than the page's headings, so a WordPress
              theme change can't silently break the labels."""
              m = re.search(r'CERNCourier(\d{4})([A-Za-z]+?)-digitaledition', pdf, re.I)
              if not m:
                  return ''
              year, rest = m.group(1), m.group(2)
              parts, i = [], 0
              while i < len(rest):
                  for name in sorted(MONTHS, key=len, reverse=True):
                      if rest[i:i+len(name)].lower() == name.lower():
                          parts.append(name[:3] if len(name) > 3 else name)
                          i += len(name)
                          break
                  else:
                      i += 1
              return ('/'.join(parts) + ' ' + year) if parts else year

          def parse(html):
              items, seen = [], set()
              for m in re.finditer(r'href="([^"]*CERNCourier[^"]*digitaledition[^"]*\.pdf)"', html, re.I):
                  pdf = absolute(m.group(1))
                  if pdf in seen:
                      continue                       # the hero block repeats the newest issue
                  seen.add(pdf)
                  # the cover <img> sits inside the same anchor, so it follows the href;
                  # every cover file is named CC*, which keeps adverts, logos and site
                  # chrome out of the match
                  window = html[m.end():m.end() + 600]
                  hit = re.search(r'<img[^>]+src="([^"]*/CC[^"/]*\.(?:jpe?g|png))"', window, re.I)
                  items.append({'label': label_from(pdf),
                                'pdf': pdf,
                                'cover': absolute(hit.group(1)) if hit else ''})
                  if len(items) == KEEP:
                      break
              return items

          if __name__ == '__main__':
              req = urllib.request.Request(SRC, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; desk-reading-list/1.0)'})
              html = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
              items = parse(html)
              if not items:
                  raise SystemExit('no issues parsed - archive page layout probably changed')
              out = {'fetched': datetime.datetime.now(datetime.timezone.utc)
                                      .strftime('%Y-%m-%dT%H:%M:%SZ'),
                     'source': SRC, 'issues': items}
              with open('cern-courier.json', 'w', encoding='utf-8') as f:
                  json.dump(out, f, ensure_ascii=False, indent=1)
              print(json.dumps(out, indent=1))
          PYEOF

      - name: Commit if the listing moved
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # the fetched timestamp changes every run; only commit real changes
          real=$(git diff -U0 -- cern-courier.json \
                 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v '"fetched"' || true)
          if [ -z "$real" ]; then
            echo 'no change'
            git checkout -- cern-courier.json 2>/dev/null || true
          else
            git add cern-courier.json
            git commit -m 'CERN Courier: refresh issue listing'
            git push
          fi
